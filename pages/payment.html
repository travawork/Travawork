<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - Travawork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0d;
      --bg-card: #12141a;
      --accent-red: #bc002d;
      --accent-red-hover: #e60033;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #262933;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding-bottom: 60px; }

    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 8%; background: rgba(10, 11, 13, 0.9);
      border-bottom: 1px solid var(--border-color);
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--text-main); text-decoration: none; }
    .logo span { color: var(--accent-red); }

    .container { max-width: 650px; margin: 50px auto; padding: 0 20px; }
    .card-box { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); padding: 35px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .price-tag { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 20px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted); }
    .form-group select, .form-group input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #0a0b0d; color: #fff; font-size: 0.95rem;
    }
    .btn-submit {
      width: 100%; background: var(--accent-red); color: white; padding: 14px;
      border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;
      margin-top: 10px; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--accent-red-hover); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">travawork<span>.</span></a>
  </nav>

  <div class="container">
    <div class="card-box">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">← Batal</a>
      <h1 style="margin-top: 15px;">Konfirmasi Pembayaran</h1>
      <p style="color: var(--text-muted);">Paket Lengkap JLPT N5-N3 + SSW 1 + Career Support</p>
      
      <div class="price-tag">Rp999.000</div>

      <form action="register.html">
        <div class="form-group">
          <label>Metode Pembayaran</label>
          <select required>
            <option value="">-- Pilih Metode --</option>
            <option value="bca">BCA Virtual Account</option>
            <option value="mandiri">Mandiri Virtual Account</option>
            <option value="qris">QRIS / Gopey / OVO</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email Penerima Akses</label>
          <input type="email" placeholder="nama@email.com" required>
        </div>

        <button type="submit" class="btn-submit">Lanjut ke Pembayaran →</button>
      </form>
    </div>
  </div>

</body>
</html>
