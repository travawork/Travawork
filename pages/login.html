<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Travawork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0d;
      --bg-card: #12141a;
      --accent-red: #bc002d;
      --accent-red-hover: #e60033;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #262933;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    
    .login-box { width: 100%; max-width: 400px; background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-main); text-decoration: none; display: block; margin-bottom: 25px; }
    .logo span { color: var(--accent-red); }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0a0b0d; color: #fff; }

    .btn-submit { width: 100%; background: var(--accent-red); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-submit:hover { background: var(--accent-red-hover); }
  </style>
</head>
<body>

  <div class="login-box">
    <a href="index.html" class="logo">travawork<span>.</span></a>
    <h2 style="font-size: 1.4rem; margin-bottom: 20px;">Masuk ke Member Area</h2>

    <form action="index.html">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Masuk</button>
    </form>

    <p style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
      Belum punya akun? <a href="register.html" style="color: var(--accent-red); text-decoration: none;">Daftar disini</a>
    </p>
  </div>

</body>
</html>
