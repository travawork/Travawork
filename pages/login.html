<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Trava Work</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #172033; background-color: #f8fafc; }
        
        header { background: #071d45; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
        
        .auth-container { padding: 3rem 1.5rem; max-width: 450px; margin: 0 auto; }
        .auth-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .auth-card h2 { color: #071d45; margin-bottom: 0.5rem; text-align: center; }
        .auth-card p { text-align: center; color: #667085; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #334155; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        
        .btn-submit { display: block; width: 100%; background: #071d45; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-top: 1rem; }
        .btn-submit:hover { background: #12356d; }

        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #667085; }
        .auth-footer a { color: #0284c7; text-decoration: none; font-weight: 600; }

        footer { text-align: center; padding: 1.5rem; background: #071d45; color: #cbd5e1; font-size: 0.85rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">Trava Work</a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Selamat Datang Kembali</h2>
            <p>Masuk ke akun Anda untuk melanjutkan akses kelas & layanan karir</p>
            
            <form action="../dashboard/index.html">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Masuk Akun</button>
            </form>

            <div class="auth-footer">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Trava Work. All rights reserved.</p>
    </footer>

</body>
</html>
