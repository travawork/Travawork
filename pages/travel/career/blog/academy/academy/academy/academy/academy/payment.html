<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Kursus - Trava Work Academy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #172033; background-color: #f8fafc; }
        
        header { background: #071d45; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
        
        .checkout-container { padding: 3rem 1.5rem; max-width: 600px; margin: 0 auto; }
        .checkout-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .checkout-card h2 { color: #071d45; margin-bottom: 1.5rem; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; }
        
        .order-summary { background: #f8fafc; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; border: 1px solid #e2e8f0; }
        .summary-item { display: flex; justify-content: space-between; font-weight: 600; color: #071d45; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        
        .btn-pay { display: block; width: 100%; background: #38bdf8; color: #071d45; border: none; padding: 0.8rem; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-top: 1rem; }
        .btn-pay:hover { background: #0284c7; color: white; }

        footer { text-align: center; padding: 1.5rem; background: #071d45; color: #cbd5e1; font-size: 0.85rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">Trava Work</a>
    </header>

    <div class="checkout-container">
        <div class="checkout-card">
            <h2>Konfirmasi Pembayaran</h2>
            
            <div class="order-summary">
                <div class="summary-item">
                    <span>Paket Program:</span>
                    <span>Kelas Pro (N4 + Skill)</span>
                </div>
                <div class="summary-item" style="margin-top: 0.5rem; color: #0284c7;">
                    <span>Total Tagihan:</span>
                    <span>Rp 350.000</span>
                </div>
            </div>

            <form action="../../dashboard/index.html">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="method">Metode Pembayaran</label>
                    <select id="method" required>
                        <option value="">-- Pilih Metode --</option>
                        <option value="qris">QRIS / GoPay / OVO / ShopeePay</option>
                        <option value="bca">Transfer Bank BCA</option>
                        <option value="mandiri">Transfer Bank Mandiri</option>
                        <option value="alfamart">Indomaret / Alfamart</option>
                    </select>
                </div>

                <button type="submit" class="btn-pay">Bayar Sekarang</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Trava Work Academy. All rights reserved.</p>
    </footer>

</body>
</html>
